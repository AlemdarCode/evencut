# Runs every test suite of the README's "How we tested" section on GitHub's machines:
# the Python package (native library and pure-Python fallback) on Python 3.9-3.13, the PyTorch
# integrations on CPU, the C++ and C tests, the Docker image, and ruff. No GPU is used here; the
# GPU measurements in bench/results come from rented machines.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (builds the native library)
        run: python -m pip install ".[test,service,train]"
      - name: The native library is the active backend
        run: python -c "import evencut, sys; print(evencut.backend); sys.exit(evencut.backend != 'native')"
      - name: Tests with the native library
        run: python -m pytest -q -rs
      - name: Tests with the pure-Python fallback
        run: python -m pytest -q -rs
        env:
          EVENCUT_FORCE_PURE: "1"

  torch:
    name: PyTorch, transformers, Lightning, Accelerate (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and the trainer libraries
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test,service,train,hf]" lightning
      - name: Tests
        run: python -m pytest -q -rs

  cpp:
    name: C++ and C tests, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f docker/Dockerfile -t evencut .
      - name: The CLI in the image partitions the README example
        run: echo "5 3 8 2 7 4 6 1 9 5" | docker run --rm -i evencut evencut -k 3 | tee /dev/stderr | grep -q '"max_load":18'

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.3
      - run: ruff check --select F,E9,B --line-length 120 bench python/evencut/train tests/python
