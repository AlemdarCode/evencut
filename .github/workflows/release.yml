# Builds the wheels (with the native library) and the sdist, tests every wheel, and publishes them
# to PyPI when a GitHub release is published. A manual run (workflow_dispatch) only builds and
# tests. Publishing uses PyPI trusted publishing, so no API token is stored anywhere, and it waits
# for a maintainer to approve the "pypi" environment.
#
# Actions are pinned to commit SHAs because this workflow can publish; Dependabot keeps them current.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Wheel, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 and ARM64, Windows x86-64, macOS Apple Silicon and Intel
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # settings, including the test command each wheel must pass, are in pyproject.toml
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build --sdist
      - name: The PyPI page renders
        run: python -m twine check --strict dist/*
      - name: The sdist builds and passes the tests
        run: |
          python -m pip install "$(ls dist/*.tar.gz)[test]"
          python -c "import evencut, sys; print(evencut.backend); sys.exit(evencut.backend != 'native')"
          cd tests && python -m pytest python -q -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/evencut/
    permissions:
      id-token: write # trusted publishing: PyPI verifies this run instead of a token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Files to publish
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
