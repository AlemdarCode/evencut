[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "evencut"
version = "1.0.0"
description = "Find and fix wasted GPU time in data-parallel training, and pick the machine that finishes the job for the least money"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "AlemdarCode" }]
keywords = ["distributed training", "data parallel", "padding", "batch sampler", "load balancing", "gpu",
            "pytorch", "partitioning", "pipeline parallelism", "linear partition"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27"]
train = ["tokenizers>=0.15"]
hf = ["transformers>=5.17", "accelerate>=1.0"]

[project.urls]
Homepage = "https://github.com/AlemdarCode/evencut"
Repository = "https://github.com/AlemdarCode/evencut"
Issues = "https://github.com/AlemdarCode/evencut/issues"

[project.scripts]
evencut-train = "evencut.train.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/evencut"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
EVENCUT_BUILD_SHARED = "ON"
EVENCUT_BUILD_CLI = "OFF"
EVENCUT_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
